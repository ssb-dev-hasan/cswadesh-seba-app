name: Build Swadesh Seba APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Web Directory
        run: |
          npm install
          npm run build
          npx cap add android

      - name: Configure Back Button Handling in MainActivity
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.swadeshseba.app;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                    getBridge().getWebView().post(() ->
                      getBridge().getWebView().evaluateJavascript(
                        "if (typeof window.__swadeshHandleBack === 'function') { window.__swadeshHandleBack(); } else { window.history.back(); }",
                        null
                      )
                    );
                  }
                }
              });
            }
          }
          EOF
            PKG_LINE=$(grep -m 1 "^package " android/app/src/main/java/*/*/MainActivity.java 2>/dev/null || true)
            ACTUAL_FILE=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
            if [ -n "$ACTUAL_FILE" ]; then
              ACTUAL_PKG=$(grep -m 1 "^package " "$ACTUAL_FILE" || echo "package com.swadeshseba.app;")
              cat << EOF > "$ACTUAL_FILE"
          $ACTUAL_PKG

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                    getBridge().getWebView().post(() ->
                      getBridge().getWebView().evaluateJavascript(
                        "if (typeof window.__swadeshHandleBack === 'function') { window.__swadeshHandleBack(); } else { window.history.back(); }",
                        null
                      )
                    );
                  }
                }
              });
            }
          }
          EOF
            fi
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK & AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Swadesh-Seba-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB File
        uses: actions/upload-artifact@v4
        with:
          name: Swadesh-Seba-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
